name = "community-game-votes"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Replace with your GitHub Pages origin, e.g. "https://yourname.github.io"
[vars]
ALLOWED_ORIGIN = "https://yourname.github.io"

# Create with: wrangler kv namespace create VOTES
# Then paste the returned id below.
[[kv_namespaces]]
binding = "VOTES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Set secrets after deploying, they must NOT go in this file:
#   wrangler secret put SYNC_SECRET
#   wrangler secret put ADMIN_SECRET
